name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Type check
        run: npm run typecheck

      - name: Verify Text Highlight Engine in browsers
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/text-highlight-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verifyTextHighlightEngine.mjs

      - name: Run test suite
        run: npm test

      - name: Check ownership
        run: npm run check:ownership

      - name: Check package boundaries
        run: npm run check:package-boundaries

      - name: Smoke test packages
        run: npm run test:package

      - name: Upload Text Highlight Engine browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-highlight-engine-browser-evidence
          path: output/playwright/text-highlight-engine/
